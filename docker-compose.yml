services:
  db:
    image: ankane/pgvector:latest
    container_name: grips_postgres_vector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-grips_db}
    ports:
      - "127.0.0.1:5432:5432"  # só acessível pela própria máquina
    volumes:
      - grips_db_data:/var/lib/postgresql/data

volumes:
  grips_db_data:
